<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeighTunes</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">♪</span>
        <span class="logo-text">LeighTunes</span>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="home">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg>
          Home
        </button>
        <button class="nav-item" data-view="library">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
          Your Library
        </button>
      </nav>

      <div class="playlist-section">
        <div class="section-header">
          <span>PLAYLISTS</span>
          <button id="new-playlist-btn" title="Create playlist">+</button>
        </div>
        <ul id="playlist-list" class="playlist-list"></ul>
      </div>

      <div class="sidebar-footer">
        <p>Offline mode • Works on restricted networks</p>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="back-btn" class="icon-btn" title="Back">‹</button>
          <button id="forward-btn" class="icon-btn" title="Forward">›</button>
        </div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="search-input" placeholder="Search in current playlist..." />
        </div>
        <div class="user-area">
          <button id="add-files-btn" class="btn-primary">+ Add Songs</button>
          <input type="file" id="file-input" accept="audio/*" multiple hidden />
        </div>
      </header>

      <div class="content" id="content">
        <!-- Dynamic content injected here -->
      </div>
    </main>

    <!-- Player bar -->
    <footer class="player">
      <div class="now-playing">
        <div class="cover" id="now-cover">
          <span class="cover-placeholder">♪</span>
        </div>
        <div class="track-info">
          <div class="track-title" id="now-title">No track selected</div>
          <div class="track-artist" id="now-artist">—</div>
        </div>
        <button class="icon-btn like-btn" id="like-btn" title="Like">♡</button>
      </div>

      <div class="controls">
        <div class="control-buttons">
          <button class="icon-btn" id="shuffle-btn" title="Shuffle">⇄</button>
          <button class="icon-btn" id="prev-btn" title="Previous">⏮</button>
          <button class="play-btn" id="play-btn" title="Play">▶</button>
          <button class="icon-btn" id="next-btn" title="Next">⏭</button>
          <button class="icon-btn" id="repeat-btn" title="Repeat">↻</button>
        </div>
        <div class="progress-area">
          <span id="current-time">0:00</span>
          <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-handle" id="progress-handle"></div>
          </div>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="extra-controls">
        <button class="icon-btn" id="queue-btn" title="Queue">☰</button>
        <div class="volume-area">
          <button class="icon-btn" id="mute-btn" title="Mute">🔊</button>
          <div class="volume-bar" id="volume-bar">
            <div class="volume-fill" id="volume-fill"></div>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <!-- Hidden audio element -->
  <audio id="audio" preload="metadata"></audio>

  <script src="app.js"></script>
</body>
</html>
